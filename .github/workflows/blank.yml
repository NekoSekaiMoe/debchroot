name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Run unit tests
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests with coverage
        run: yarn test:coverage

  # Test Debian/Ubuntu
  test-debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: debian
            version: bookworm
            arch: arm64
          - distro: debian
            version: bullseye
            arch: amd64
          - distro: ubuntu
            version: jammy
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.distro }} ${{ matrix.version }} ${{ matrix.arch }}
        uses: ./
        with:
          distro: ${{ matrix.distro }}
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Run command via debsh
        run: debsh uname -a

  # Test Alpine
  test-alpine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: v3.19
            arch: arm64
          - version: v3.20
            arch: amd64
    steps:
      - uses: actions/checkout@v6
      - name: Test Alpine ${{ matrix.version }} ${{ matrix.arch }}
        uses: ./
        with:
          distro: alpine
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          packages: curl git
      - name: Run command via debsh
        run: debsh uname -a

  # Test Arch Linux
  test-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Arch Linux
        uses: ./
        with:
          distro: arch
          arch: arm64
          packages: curl
      - name: Run command via debsh
        run: debsh uname -a

  # Test with packages
  test-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test with additional packages
        uses: ./
        with:
          distro: debian
          version: bookworm
          arch: arm64
          packages: curl wget git
      - name: Verify packages installed
        run: |
          debsh which curl
          debsh which wget
          debsh which git
