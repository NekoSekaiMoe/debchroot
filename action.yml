name: 'debchroot'
description: 'Cross-distribution rootfs creation and chroot execution for GitHub Actions'
author: 'dabao1955'
branding:
  icon: 'box'
  color: 'blue'

inputs:
  distro:
    description: |
      Target Linux distribution:
      - debian, ubuntu (uses debootstrap)
      - arch (uses pacstrap)
      - alpine (uses alpine-make-rootfs)
      - fedora (uses dnf, experimental)
      - opensuse (uses zypper, experimental)
    required: false
    default: 'debian'
  
  arch:
    description: 'Target architecture (amd64, arm64, armhf, i386, etc.)'
    required: false
    default: 'arm64'
  
  version:
    description: |
      Distribution version:
      - debian: bookworm, bullseye, trixie, etc.
      - ubuntu: jammy, noble, etc.
      - arch: base (ignored)
      - alpine: v3.19, v3.20, edge, etc.
      - fedora: 39, 40, rawhide, etc.
      - opensuse: leap/15.5, tumbleweed, etc.
    required: false
    default: 'bookworm'
  
  packages:
    description: 'Additional packages to install (space-separated)'
    required: false
    default: ''

outputs:
  rootfs:
    description: 'Path to the created rootfs'

runs:
  using: 'node24'
  main: 'dist/index.js'